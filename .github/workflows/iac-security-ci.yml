name: "AWS IaC Quality & Security Guardrails"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Fitsapana OpenTofu / Terraform syntaxes
      - name: Setup OpenTofu / TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      # 2. Fitsapana ny Fiarovana amin'ny Checkov (S3 Public Access, Ports open, Encryption, etc.)
      - name: Run Checkov Static Code Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          framework: kubernetes,crossplane,terraform
          output_format: cli
          soft_fail: false
